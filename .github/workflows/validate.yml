# PR build validation

name: Validate

on:
  # The Valenced API is built from its public source before packaging, so no
  # package-read token is needed and this can safely run on pull_request.
  pull_request:
    paths:
      - 'plugins/**'
      - 'themes/**'
      - 'cli/**'
      - '.github/**'
      - 'repo.config.json'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Lint the workflow scripts
        run: shellcheck .github/scripts/*.sh

      - uses: actions/checkout@v4
        with:
          repository: Valenced/valenced
          path: valenced-src

      - name: Build the Valenced API from its public source
        working-directory: valenced-src
        run: ./gradlew :core:publishToMavenLocal :android:api:publishToMavenLocal -x test --no-daemon

      - name: Build all plugins
        run: ./gradlew --no-daemon packageAllPlugins

      - name: Generate index from built artifacts
        run: |
          bun run generate-index \
            --dist build/dist \
            --base-url https://valenced.local \
            --out /tmp/index.json
          cat /tmp/index.json

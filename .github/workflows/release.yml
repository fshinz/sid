# A plugin is released when the published pool doesn't have `<id>@<version>.zip` for its manifest version.
# The pool contains all relevant data. Git tags and GitHub releases are created for changelogs only.

name: Release plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-pool
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Branch holding the pool. Set the POOL_BRANCH repository variable to move it.
  POOL_BRANCH: ${{ vars.POOL_BRANCH }}
  # Set the PAGES_BASE_URL repository variable when the pool is served from a custom domain.
  PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
  POOL_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
  PLAN: ${{ github.workspace }}/releases.json

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Existing tags, so a re-run doesn't try to recreate one.

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - run: bun install

      - name: Check out the published pool
        run: .github/scripts/checkout-pool.sh

      - name: Plan releases
        id: plan
        run: .github/scripts/plan-releases.sh

      - uses: actions/checkout@v4
        if: steps.plan.outputs.count != '0'
        with:
          repository: Valenced/valenced
          # Pinned to the API release this repo's catalog pins (app.valenced:api:1.0.0).
          # Publishing HEAD publishes whatever apiVersion it declares, so when upstream bumps it
          # the local artifacts no longer satisfy the catalog and Gradle falls through to GitHub
          # Packages, which needs a read:packages token. Bump this ref and
          # gradle/libs.versions.toml together.
          ref: api@1.0.0
          path: valenced-src

      - name: Build the Valenced API from its public source
        if: steps.plan.outputs.count != '0'
        working-directory: valenced-src
        run: ./gradlew :core:publishToMavenLocal :android:api:publishToMavenLocal -x test --no-daemon

      - name: Build plugins
        if: steps.plan.outputs.count != '0'
        run: ./gradlew --no-daemon packageAllPlugins

      - name: Publish to the pool
        if: steps.plan.outputs.count != '0'
        run: .github/scripts/publish-pool.sh

      - name: Tag and write changelogs
        if: steps.plan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/tag-releases.sh
